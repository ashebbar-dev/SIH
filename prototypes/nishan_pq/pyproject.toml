[project]
name = "nishan-pq"
version = "0.1.0"
description = "Offline post-quantum document leak attribution prototype for SIH26237"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=46",
  "numpy>=2",
  "opencv-python-headless>=4.11",
  "Pillow>=11",
  "PyMuPDF>=1.26",
]

[project.scripts]
nishan = "nishan.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
